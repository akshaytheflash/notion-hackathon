services:
  - type: web
    name: enterprise-ai-os
    runtime: python
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build && cd ..
      pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_INCIDENTS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_POLICIES_DATA_SOURCE_ID
        sync: false
      - key: NOTION_DECISIONS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_APPROVALS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_ACTION_LOG_DATA_SOURCE_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: akshaytheflash
      - key: GITHUB_REPO
        value: notion-system
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: APPROVAL_POLL_INTERVAL_SECONDS
        value: 5
      - key: FRONTEND_ORIGIN
        value: "*"
